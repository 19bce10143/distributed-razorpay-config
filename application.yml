spring:
  threads:
      virtual:
        enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true      
  datasource:
    url: jdbc:postgresql://localhost:5432/razorpayDB
    username: postgres
    password: postgres
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:29092
    listener:
      ack-mode: manual
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[enable.idempotence]": true
        "[max.in.flight.requests.per.connection]": 5
        "[retries]": 3
        "[delivery.timeout.ms]": 30000
        "[request.timeout.ms]": 10000
        "[spring.json.add.type.headers]": false
    consumer:
      group-id: razorpay-monolith
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        "[spring.json.trusted.packages]": "com.project.razorpay.*"
        "[spring.json.use.type.headers]": false
        "[spring.json.value.default.type]": java.util.LinkedHashMap

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    org.apache.kafka.clients: WARN
    org.apache.kafka.common: WARN

payment:
  simulator:
    poll-interval-ms: 5000
    chaos-mode: SUCCESS
    methods:
      CARD:
        min-delay-seconds: 2
        max-delay-seconds: 6
        success-rate: 90
      UPI:
        min-delay-seconds: 1
        max-delay-seconds: 3
        success-rate: 95
      NET_BANKING:
        min-delay-seconds: 4
        max-delay-seconds: 10
        success-rate: 80

settlement:
  simulator:
    poll-interval-ms: 5000
    chaos-mode: SUCCESS
    min-delay-seconds: 2
    max-delay-seconds: 8
    success-rate: 90

app:
  rate-limit:
    method: bucket
    use-case:
      api-key:
        requests-per-minute: 200 # change in production
  outbox:
    poll-interval-ms: 5000
  kafka:
      topics:
        payment: payment.events
        order: order.events
        refund: refund.events
        settlement: settlement.events
  webhook:
      delivery:
        redis-key: "webhook-retry"
        poll-batch-size: 100
        max-concurrency: 50
