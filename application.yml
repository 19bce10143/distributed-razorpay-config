spring:
  threads:
      virtual:
        enabled: true
        
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true      
    
  datasource:
    username: postgres
    password: postgres
    
  data:
    redis:
      host: localhost
      port: 6379
      
  kafka:
    bootstrap-servers: localhost:29092
    listener:
      ack-mode: manual
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[enable.idempotence]": true
        "[max.in.flight.requests.per.connection]": 5
        "[retries]": 3
        "[delivery.timeout.ms]": 30000
        "[request.timeout.ms]": 10000
        "[spring.json.add.type.headers]": false
    consumer:
      group-id: razorpay-monolith
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        "[spring.json.trusted.packages]": "com.project.razorpay.*"
        "[spring.json.use.type.headers]": false
        "[spring.json.value.default.type]": java.util.LinkedHashMap

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.apache.kafka.clients: WARN
    org.apache.kafka.common: WARN

app:
  kafka:
      topics:
        payment: payment.events
        order: order.events
        refund: refund.events
        settlement: settlement.events
