server:
  port: 9020
  
spring:  
  datasource:
    url: jdbc:postgresql://localhost:5432/razorpay-payment-db
  cloud:
    openfeign:
      client:
        config:
          merchant-service:
            connectTimeout: 2000
            readTimeout: 5000
          vault-service:
            connectTimeout: 2000
            readTimeout: 5000

resilience4j:
  circuitbreaker:
    instances:
      merchant-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
      vault-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      merchant-service:
        max-attempts: 3
        wait-duration: 500ms
      vault-service:
        max-attempts: 3
        wait-duration: 500ms  
  thread-pool-bulkhead:
    instances:
      payment-card-processor:
        core-thread-pool-size: 5
        max-thread-pool-size: 10
        queue-capacity: 20     
      payment-net-banking-processor:
        core-thread-pool-size: 5
        max-thread-pool-size: 10
        queue-capacity: 20
      payment-upi-processor:
        core-thread-pool-size: 5
        max-thread-pool-size: 10
        queue-capacity: 20                   