server:
  port: 9020
  
spring:  
  datasource:
    url: jdbc:postgresql://localhost:5432/razorpay-payment-db
  cloud:
    openfeign:
      client:
        config:
          merchant-service:
            connectTimeout: 2000
            readTimeout: 5000
          vault-service:
            connectTimeout: 2000
            readTimeout: 5000

resilience4j:
  circuitbreaker:
    instances:
      merchant-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
      vault-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      merchant-service:
        max-attempts: 3
        wait-duration: 500ms
      vault-service:
        max-attempts: 3
        wait-duration: 500ms  
  thread-pool-bulkhead:
    instances:
      payment-card-processor:
        core-thread-pool-size: 5
        max-thread-pool-size: 10
        queue-capacity: 20     
      payment-net-banking-processor:
        core-thread-pool-size: 5
        max-thread-pool-size: 10
        queue-capacity: 20
      payment-upi-processor:
        core-thread-pool-size: 5
        max-thread-pool-size: 10
        queue-capacity: 20    

payment:
  simulator:
    poll-interval-ms: 5000
    chaos-mode: SUCCESS
    methods:
      CARD:
        min-delay-seconds: 2
        max-delay-seconds: 6
        success-rate: 90
      UPI:
        min-delay-seconds: 1
        max-delay-seconds: 3
        success-rate: 95
      NET_BANKING:
        min-delay-seconds: 4
        max-delay-seconds: 10
        success-rate: 80        

refund:
  simulator:
    enabled: true
    poll-interval-ms: 2000
    batch-size: 100
    chaos-mode: NORMAL
    min-delay-seconds: 1
    max-delay-seconds: 5
    success-rate: 100               