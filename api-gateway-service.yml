server:
  port: 8080

app:
  security:
    trust-inbound-headers: false
    public-routes:
      - "/v1/auth/**"
      - "/webhook/**"
      - "/actuator/prometheus"
      - "/actuator/health"
    auth-rules:
      - path: /v1/merchants/**
        methods: [GET, HEAD, POST, PUT, DELETE]
        schemes: [BASIC, BEARER]
      - paths:
          - /v1/orders
          - /v1/orders/{orderId}/checkout-code
          - /v1/orders/{orderId}/cancel
          - /v1/payments/{paymentId}/capture
        methods: [POST]
        schemes: [BASIC]
      - path: /v1/orders/{orderId}
        methods: [GET, HEAD]
        schemes: [BASIC, CHECKOUT]
      - path: /v1/payments
        methods: [POST]
        schemes: [CHECKOUT]
      - path: /v1/payments/{paymentId}/status
        methods: [GET]
        schemes: [CHECKOUT]  
      - path: /v1/payments/{paymentId}/refunds
        methods: [POST, GET, HEAD]
        schemes: [BASIC]
      - path: /v1/payments/{paymentId}/refunds/{refundId}
        methods: [GET, HEAD]
        schemes: [BASIC]
      - path: /v1/vault/tokenize
        methods: [POST]
        schemes: [CHECKOUT]
      - path: /callbacks/bank/payments/**
        methods: [POST]
        schemes: [BANK_CALLBACK]  
  rate-limit:
    method: fixed
    use-case:
      api-key:
        requests-per-minute: 200

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: merchant-service
              uri: ${MERCHANT_SERVICE_URI:lb://merchant-service}
              predicates:
                - Path=/v1/auth/**,/v1/merchants/**

            - id: payment-service
              uri: ${PAYMENT_SERVICE_URI:lb://payment-service}
              predicates:
                - Path=/v1/orders/**,/v1/payments/**,/v1/checkout/orders/{orderId},/callbacks/bank/payments/**

            - id: vault-service
              uri: ${VAULT_SERVICE_URI:lb://vault-service}
              predicates:
                - Path=/v1/vault/**

            - id: operations-service
              uri: ${OPERATIONS_SERVICE_URI:lb://operations-service} 
              predicates:
                - Path=/webhook/**
        
