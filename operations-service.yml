server:
  port: 9030
  
spring:  
  datasource:
    url: jdbc:postgresql://localhost:5432/razorpay-operations-db
  cloud:
    openfeign:
      client:
        config:
          merchant-service:
            connectTimeout: 2000
            readTimeout: 5000
          payment-service:
            connectTimeout: 2000
            readTimeout: 5000  

resilience4j:
  circuitbreaker:
    instances:
      merchant-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
      payment-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      merchant-service:
        max-attempts: 3
        wait-duration: 500ms
      payment-service:
        max-attempts: 3
        wait-duration: 500ms                
    
app:
  kafka:
    refund-accounting-group: operations-refund-accounting
  webhook:
    delivery:
      redis-key: "webhook-retry"
      poll-batch-size: 100
      max-concurrency: 50

settlement:
  simulator:
    poll-interval-ms: 5000
    chaos-mode: SUCCESS
    min-delay-seconds: 2
    max-delay-seconds: 8
    success-rate: 90      
      